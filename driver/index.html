<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16181B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WeRoad">
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" href="icon.svg?v=6" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=6">
<title>위로드 배송기사웹</title>
</head>
<body style="margin:0;background:#16181B">
<!-- 11/20 로더: 실제 화면(app.html)은 매번 서버에서 새로 받아옴 → 수정하면 1분 안에 모든 폰에 적용 (홈 화면에 다시 추가할 필요 없음) -->
<script>
/* 예전 화면이 새 버전을 알아채도록: const BUILD = 'loader' */
(function () {
  var go = function (t) { document.open(); document.write(t); document.close(); };
  fetch('app.html?v=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(go)
    .catch(function () { location.replace('app.html' + location.search + location.hash); });
})();
</script>
</body>
</html>
